name: 🜂 Gamma Coherence

on:
  push:
    branches: ['**']

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 🜂 Analizar
        id: analyze
        run: |
          HASH=$(git rev-parse HEAD)
          MSG=$(git log -1 --pretty=%B | head -1)
          
          # Ejecutar y capturar output completo
          python gamma-core/coherence.py "$HASH" "$MSG" > result.json
          
          # Leer valores directamente
          COHERENCE=$(python -c "import json; print(json.load(open('result.json'))['coherence'])")
          SIGNATURE=$(python -c "import json; print(json.load(open('result.json'))['signature'])")
          COHERENT=$(python -c "import json; print(json.load(open('result.json'))['coherent'])")
          
          echo "coherence=$COHERENCE" >> $GITHUB_OUTPUT
          echo "signature=$SIGNATURE" >> $GITHUB_OUTPUT
          echo "coherent=$COHERENT" >> $GITHUB_OUTPUT
          
          if [ "$COHERENT" = "True" ]; then
            echo "status=✅ COHERENTE" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ BAJA" >> $GITHUB_OUTPUT
          fi
          
          echo "📊 Coherencia: $COHERENCE"
          echo "🔏 Firma: $SIGNATURE"
      
      - name: 💬 Comentar
        uses: actions/github-script@v7
        with:
          script: |
            const coh = '${{ steps.analyze.outputs.coherence }}';
            const sig = '${{ steps.analyze.outputs.signature }}';
            const status = '${{ steps.analyze.outputs.status }}';
            
            const comment = `## 🜂 Análisis Gamma Γ-26
            
**${status}**

| Métrica | Valor |
|---------|-------|
| Coherencia φ^(-7) | \`${coh}\` |
| Firma Gamma | \`${sig}\` |
| Umbral | \`0.05572809\` |

${'${{ steps.analyze.outputs.coherent }}' === 'True' ? '✅ Commit coherente dimensional' : '⚠️ Considera refinar'}

---
*EPΩ-7 Γ-26 | Auto-Analysis*`;
            
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: comment
            });
